name: Publish library to Gitea

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Show repository context
        run: |
          echo "repository=${{ github.repository }}"
          echo "repository_owner=${{ github.repository_owner }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "server_url=${{ github.server_url }}"

      - name: Checkout GitHub develop branch
        run: |
          set -euo pipefail

          git clone \
            --branch develop \
            --depth 1 \
            --single-branch \
            https://github.com/datenwissenschaften/datenwissenschaften.git \
            source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.1"

      - name: Build wheel
        working-directory: source
        run: poetry build --format wheel

      - name: Publish commit-addressed package
        working-directory: source
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          PACKAGE_SERVER_URL: ${{ github.server_url }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          revision="$(git rev-parse HEAD)"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          package_version="${version}-r${RUN_NUMBER}+${revision}"
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          : "${wheel:?Wheel was not built}"
          wheel_name="$(basename "${wheel}")"

          curl --fail-with-body \
            --user "datenwissenschaften:${GITEA_TOKEN}" \
            --upload-file "${wheel}" \
            "${PACKAGE_SERVER_URL}/api/packages/datenwissenschaften/generic/datenwissenschaften/${package_version}/${wheel_name}"
